#version: '3.9'
name: spring-api
services:
  api-1:
    container_name: api-1
    build: .
    #image: spring-api-service:latest
#    image: baekaku/spring-api-native:latest
#    extra_hosts:
#      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    ports:
      - '8080:8080'
    expose:
      - 8080
    networks:
      - docker-network
    environment:
      - WORKER_ID=1
#      - SPRING_PROFILES_ACTIVE=localdocker
#      - JAVA_OPTS=-Xmx512m -Xms512m
    deploy:
      resources:
        limits:
          cpus: "2.0"  # Max 2 CPU cores
          memory: "2G"  # Max 2GB RAM
        reservations:
          cpus: "1.0"  # Reserve at least 1 CPU
          memory: "1G"  # Reserve at least 1GB RAM
    volumes:
      # /usr/spring-data is served publicly at /cdn/**: keep the host log and config dirs outside the host data dir too
      - d:\code\spring-data:/usr/spring-data
      - d:\code\spring-logs:/usr/spring-logs
      # external config (secrets), read-only; create_host_path: false so a missing host dir fails instead of
      # mounting an empty one (the app would then start without its external config)
      - type: bind
        source: d:\code\spring-config
        target: /usr/spring-config
        read_only: true
        bind:
          create_host_path: false
      #linux
  #      - /mnt/cdn/spring-data:/usr/spring-data
  #      - /mnt/cdn/spring-logs:/usr/spring-logs
  #      - {type: bind, source: /mnt/cdn/spring-config, target: /usr/spring-config, read_only: true, bind: {create_host_path: false}}
networks:
  docker-network:
    driver: bridge
#   external: true