name: redis
services:
  redis:
    image: ${REDIS_IMAGE:-redis:8.8-alpine}
    #image: redis:7.4.1-alpine
    container_name: ${REDIS_CONTAINER_NAME:-redis}
    command: redis-server --requirepass ${REDIS_PASSWORD}
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - '${REDIS_PORT:-6379}:6379'
      #- "122.155.208.78:6379:6379"
      #- '127.0.0.1:6379:6379'
      #- "172.17.0.1:6379:6379"
    volumes:
      - ./data/:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${REDIS_CPUS_LIMIT:-4}'
          memory: ${REDIS_MEMORY_LIMIT:-512M}
        reservations:
          cpus: '${REDIS_CPUS_RESERVATION:-2}'
          memory: ${REDIS_MEMORY_RESERVATION:-128M}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - redis-network

  redisinsights:
    image: ${REDISINSIGHT_IMAGE:-redis/redisinsight:latest}
    container_name: ${REDISINSIGHT_CONTAINER_NAME:-redisinsights}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${REDISINSIGHT_PORT:-5540}:5540"  # Expose Redis Insights on port 8001
    volumes:
      - ./redisinsight/:/data
    networks:
      - redis-network
    depends_on:
      - redis
    environment:
      - INSIGHT_HOST=${INSIGHT_HOST:-0.0.0.0}  # Listen on all interfaces
      - REDIS_1_NAME=${REDIS_1_NAME:-Local_Redis}       # Name for the Redis database in RedisInsight
      - REDIS_1_HOST=${REDIS_1_HOST:-redis}             # Redis service name in Docker network
      - REDIS_1_PORT=${REDIS_1_PORT:-6379}              # Redis port
      - REDIS_1_PASSWORD=${REDIS_PASSWORD}  # Redis password


networks:
  redis-network:
    driver: bridge
